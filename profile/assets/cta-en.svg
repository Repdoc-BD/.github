<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160"><style>
text{font-family:'Noto Sans Bengali','Hind Siliguri','Nirmala UI','Kohinoor Bangla','Bangla Sangam MN','Segoe UI','Helvetica Neue',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}44%{opacity:1}52%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.up{animation:up .8s ease both}
.fl{animation:fl 6s ease-in-out infinite}
.cy{opacity:0;animation:cyc 10s infinite backwards}
.pu{animation:pulse 2.4s ease-in-out infinite}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#2563eb"/></linearGradient><clipPath id="cp"><rect width="800" height="160" rx="20"/></clipPath></defs><rect width="800" height="160" rx="20" fill="url(#g)"/><g clip-path="url(#cp)"><rect y="-20" width="110" height="200" fill="#fff" fill-opacity=".14" transform="skewX(-20)"><animate attributeName="x" values="-300;1000" dur="4s" repeatCount="indefinite"/></rect></g><text x="400" y="62" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">Ready to get started?</text><text x="400" y="94" text-anchor="middle" font-size="17" fill="#ecfeff">Apply for an operator account, log in, and open any tool</text><rect x="285" y="108" width="230" height="36" rx="18" fill="#fff" stroke="#fff" stroke-opacity=".5"><animate attributeName="stroke-width" values="0;9;0" dur="2.4s" repeatCount="indefinite"/></rect><text x="400" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">repdoc.freedev.app</text></svg>