<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290"><style>
text{font-family:'Noto Sans Bengali','Hind Siliguri','Nirmala UI','Kohinoor Bangla','Bangla Sangam MN','Segoe UI','Helvetica Neue',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}44%{opacity:1}52%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.up{animation:up .8s ease both}
.fl{animation:fl 6s ease-in-out infinite}
.cy{opacity:0;animation:cyc 10s infinite backwards}
.pu{animation:pulse 2.4s ease-in-out infinite}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#1e40af"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#fff"/>
<animate attributeName="x1" values="-400;800" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1200" dur="4s" repeatCount="indefinite"/></linearGradient></defs><rect width="800" height="290" rx="20" fill="url(#bg)"/><g transform="translate(50,40)"><g class="fl" style="animation-delay:0s"><rect width="46" height="60" rx="6" fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".3"/><rect x="9" y="14" width="28" height="4" rx="2" fill="#fff" fill-opacity=".5"/><rect x="9" y="26" width="28" height="4" rx="2" fill="#fff" fill-opacity=".4"/><rect x="9" y="38" width="18" height="4" rx="2" fill="#fff" fill-opacity=".4"/></g></g><g transform="translate(700,60)"><g class="fl" style="animation-delay:1.2s"><rect width="46" height="60" rx="6" fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".3"/><rect x="9" y="14" width="28" height="4" rx="2" fill="#fff" fill-opacity=".5"/><rect x="9" y="26" width="28" height="4" rx="2" fill="#fff" fill-opacity=".4"/><rect x="9" y="38" width="18" height="4" rx="2" fill="#fff" fill-opacity=".4"/></g></g><g transform="translate(110,170)"><g class="fl" style="animation-delay:2.1s"><rect width="46" height="60" rx="6" fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".3"/><rect x="9" y="14" width="28" height="4" rx="2" fill="#fff" fill-opacity=".5"/><rect x="9" y="26" width="28" height="4" rx="2" fill="#fff" fill-opacity=".4"/><rect x="9" y="38" width="18" height="4" rx="2" fill="#fff" fill-opacity=".4"/></g></g><g transform="translate(630,175)"><g class="fl" style="animation-delay:0.6s"><rect width="46" height="60" rx="6" fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".3"/><rect x="9" y="14" width="28" height="4" rx="2" fill="#fff" fill-opacity=".5"/><rect x="9" y="26" width="28" height="4" rx="2" fill="#fff" fill-opacity=".4"/><rect x="9" y="38" width="18" height="4" rx="2" fill="#fff" fill-opacity=".4"/></g></g><g transform="translate(385,20)"><g class="fl" style="animation-delay:1.7s"><rect width="46" height="60" rx="6" fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".3"/><rect x="9" y="14" width="28" height="4" rx="2" fill="#fff" fill-opacity=".5"/><rect x="9" y="26" width="28" height="4" rx="2" fill="#fff" fill-opacity=".4"/><rect x="9" y="38" width="18" height="4" rx="2" fill="#fff" fill-opacity=".4"/></g></g><text x="400" y="110" text-anchor="middle" font-size="68" font-weight="800" fill="url(#sh)" letter-spacing="1">Repdoc</text><g class="cy"><text x="400" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">ডকুমেন্টের কাজ এখন আর ঝামেলার নয়</text><text x="400" y="196" text-anchor="middle" font-size="17" fill="#dbeafe">কম্পিউটার অপারেটর, দোকান ও ছোট ব্যবসার স্বতন্ত্র ডকুমেন্ট টুলকিট</text></g><g class="cy" style="animation-delay:5s"><text x="400" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Document work, without the hassle</text><text x="400" y="196" text-anchor="middle" font-size="16" fill="#dbeafe">An independent document toolkit for operators, shops &amp; small businesses in Bangladesh</text></g><g class="up" style="animation-delay:0.2s"><rect x="160" y="232" width="70" height="28" rx="14" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/><text x="195" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Word</text></g><g class="up" style="animation-delay:0.35s"><rect x="242" y="232" width="70" height="28" rx="14" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/><text x="277" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Excel</text></g><g class="up" style="animation-delay:0.5s"><rect x="324" y="232" width="70" height="28" rx="14" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/><text x="359" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">PDF</text></g><g class="up" style="animation-delay:0.6499999999999999s"><rect x="406" y="232" width="70" height="28" rx="14" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/><text x="441" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">PSD</text></g><g class="up" style="animation-delay:0.8s"><rect x="488" y="232" width="70" height="28" rx="14" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/><text x="523" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">AI</text></g><g class="up" style="animation-delay:0.95s"><rect x="570" y="232" width="70" height="28" rx="14" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/><text x="605" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">PLP</text></g></svg>