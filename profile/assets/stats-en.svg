<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150"><style>
text{font-family:'Noto Sans Bengali','Hind Siliguri','Nirmala UI','Kohinoor Bangla','Bangla Sangam MN','Segoe UI','Helvetica Neue',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}44%{opacity:1}52%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.up{animation:up .8s ease both}
.fl{animation:fl 6s ease-in-out infinite}
.cy{opacity:0;animation:cyc 10s infinite backwards}
.pu{animation:pulse 2.4s ease-in-out infinite}
</style><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><g class="up" style="animation-delay:0.0s"><rect x="0" y="0" width="185" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><text x="92" y="72" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">7+</text><text x="92" y="104" text-anchor="middle" font-size="16" fill="#bfdbfe">Core tools</text><rect x="62" y="122" width="0" height="4" rx="2" fill="#38bdf8"><animate attributeName="width" from="0" to="60" dur="1s" begin="0.6s" fill="freeze"/></rect></g><g class="up" style="animation-delay:0.15s"><rect x="205" y="0" width="185" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><text x="297" y="72" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">6</text><text x="297" y="104" text-anchor="middle" font-size="16" fill="#bfdbfe">File formats</text><rect x="267" y="122" width="0" height="4" rx="2" fill="#38bdf8"><animate attributeName="width" from="0" to="60" dur="1s" begin="0.75s" fill="freeze"/></rect></g><g class="up" style="animation-delay:0.3s"><rect x="410" y="0" width="185" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><text x="502" y="72" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">48</text><text x="502" y="104" text-anchor="middle" font-size="16" fill="#bfdbfe">Useful links</text><rect x="472" y="122" width="0" height="4" rx="2" fill="#38bdf8"><animate attributeName="width" from="0" to="60" dur="1s" begin="0.8999999999999999s" fill="freeze"/></rect></g><g class="up" style="animation-delay:0.44999999999999996s"><rect x="615" y="0" width="185" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><text x="707" y="72" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">1</text><text x="707" y="104" text-anchor="middle" font-size="16" fill="#bfdbfe">Account for all</text><rect x="677" y="122" width="0" height="4" rx="2" fill="#38bdf8"><animate attributeName="width" from="0" to="60" dur="1s" begin="1.0499999999999998s" fill="freeze"/></rect></g></svg>